name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  Backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "backend/.go-version"
          cache-dependency-path: "backend/go.sum"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ./backend
          args: --config=.golangci.yml

      - run: go install github.com/mfridman/tparse@v0.18.0

      - name: Run tests
        working-directory: ./backend
        run: |
          set -o pipefail
          go test -race -cover -json ./... | tparse --all

  Frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2.0.2
        with:
          version: "11.21.0"
          runtime: node@24
          cache: true
      - run: pnpm --filter @me/public lint
      - run: pnpm --filter @me/public build
      - run: pnpm --filter @me/public test