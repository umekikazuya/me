<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' style='dominant-baseline:central;text-anchor:middle;font-size:90px'%3E%F0%9F%A5%9D%3C/text%3E%3C/svg%3E" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>umekikazuya</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&family=IBM+Plex+Sans+JP:wght@400;500&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="./src/index.css" />
	<script>
		// FOUC prevention: initialize theme and boot state before first paint
		(() => {
			const root = document.documentElement;
			const isAdmin = window.location.pathname === '/admin' || window.location.pathname.startsWith('/admin/');
			root.setAttribute('data-theme', isAdmin ? 'admin' : 'public');
			try {
				const scheme = localStorage.getItem('me.scheme');
				if (scheme === 'light' || scheme === 'dark') root.setAttribute('data-scheme', scheme);
				if (sessionStorage.getItem('me.booted') === '1') root.setAttribute('data-boot', 'skip');
			} catch {}
			if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.setAttribute('data-boot', 'skip');
		})();
	</script>
	<script type="module" src="/src/main.ts"></script>
</head>

<body>
	<div id="boot" role="status" aria-label="Loading">
		<div class="boot-inner">
			<div class="boot-row"><span>Booting</span><span class="boot-num">0</span></div>
			<div class="boot-line"><i class="boot-bar"></i></div>
		</div>
	</div>
	<noscript><style>#boot { display: none; }</style></noscript>
	<app-root></app-root>
</body>

</html>
