[tools]
air = "v1.65.1"
"aqua:mfridman/tparse" = "latest"
go = "1.26.4"
gotestsum = "latest"
node = "24"
pnpm = "10"

[env]

# --- Required ---

COMPOSE_FILE = { value = "build/docker/compose.yml" }

# --- AWS (local dev) ---

DYNAMODB_TABLE_NAME   = { value = "me." }

# --- Optional ---

API_PORT              = { value = "8000" }
FLOCI_PORT            = { value = "4566" }
SWAGGER_PORT          = { value = "8001" }
ME_ID                 = { value = "" }
JWT_SECRET            = { value = "" }
ZENN_USERNAME         = { value = "" }
QIITA_TOKEN           = { value = "" }
VITE_GA_MEASUREMENT_ID = { value = "" }